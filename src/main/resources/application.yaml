# The only base configuration file. Environment-specific values arrive as env vars:
#   * locally       -> application-local.yaml (+ compose.yaml, + .env.local)
#   * in the cluster -> chart env + Vault-synced secrets (SPRING_DATASOURCE_*, HLBUDGET_AUTH_*)
#
# There is no datasource URL or credentials here on purpose (research R-007): docker compose,
# Testcontainers or SPRING_DATASOURCE_* provide them. Only Hikari's timeouts are set, so a dead
# database flips readiness within one probe period.
spring:
  application:
    name: hl-budget-backend
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        # pgjdbc waits forever on a database that stops answering (as opposed to refusing),
        # which would hang /readyz and every request. Seconds; matches the web app's API timeout.
        connectTimeout: 2
        socketTimeout: 5
  jpa:
    hibernate:
      # Flyway owns the schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

# Required. The empty default is deliberate: Boot keeps an unresolvable placeholder as literal
# text, which would pass validation. Empty fails @NotBlank at startup, naming the property.
hlbudget:
  auth:
    issuer: ${HLBUDGET_AUTH_ISSUER:}
    audience: ${HLBUDGET_AUTH_AUDIENCE:}
    jwk-set-uri: ${HLBUDGET_AUTH_JWKSETURI:}
    claims-namespace: ${HLBUDGET_AUTH_CLAIMSNAMESPACE:}
  # Required, no default (research R-006): a wrong currency would be baked into every amount.
  money:
    currency: ${HLBUDGET_MONEY_CURRENCY:}
  time-zone: ${HLBUDGET_TIMEZONE:}

# Probes on the main port at the homelab paths (research R-008). Liveness checks nothing;
# readiness fails while Postgres is unreachable. No details or components are disclosed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
          additional-path: server:/healthz
        readiness:
          include: readinessState,db
          additional-path: server:/readyz

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-}] "
  level:
    root: INFO
