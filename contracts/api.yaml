        example: 9b2f6e1a-4c3d-4e5f-8a7b-0c1d2e3f4a5b
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeImport"
              examples:
                found:
                  description: found
                  value:
                    id: 4c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f
                    incomeCount: 2
                    firstDate: 2026-10-15
                    lastDate: 2026-10-20
