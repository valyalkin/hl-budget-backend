name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # ktlintCheck + detekt + test + koverVerify. Hosted runners have Docker for Testcontainers.
      - run: ./gradlew check

      # The frontend generates its types from this file; a stale one is a build failure.
      - name: contracts/api.yaml is up to date
        run: git diff --exit-code contracts/api.yaml

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/kover
            build/reports/detekt
            build/reports/ktlint

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
