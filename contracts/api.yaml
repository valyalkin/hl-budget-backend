components:
  schemas:
    Problem:
      type: object
      description: "RFC 9457 problem details, as produced by the backend's single\
        \ error handler"
      properties:
        type:
          type: string
          description: Stable URN naming the error category
          enum:
          - urn:problem:hl-budget:unauthenticated
          - urn:problem:hl-budget:access-denied
          - urn:problem:hl-budget:bad-request
          - urn:problem:hl-budget:not-found
          - urn:problem:hl-budget:conflict
          - urn:problem:hl-budget:unprocessable-entity
          - urn:problem:hl-budget:internal-error
          - urn:problem:hl-budget:service-unavailable
        title:
          type: string
        status:
          type: integer
          format: int32
          maximum: 599
          minimum: 400
        detail:
          type: string
          description: "Human-readable explanation. For 5xx always a fixed, safe sentence"
        instance:
          type: string
          description: Request path
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
          description: "Structured, scalar-only context; `reason` when a client must\
            \ branch"
        errors:
          type: array
          description: One entry per offending field (validation failures only)
          items:
            $ref: "#/components/schemas/FieldViolation"
      required:
      - instance
      - status
      - timestamp
      - title
      - traceId
      - type
    FieldViolation:
      type: object
      properties:
        pointer:
          type: string
          example: "#/name"
        field:
          type: string
          example: name
        code:
          type: string
          example: NotBlank
        message:
          type: string
          example: must not be blank
      required:
      - code
      - field
      - message
      - pointer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
      required:
      - status
    UserProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Opaque HL Budget identifier for the user. Not the Auth0 subject
          example: 0b9f6c1e-3c1a-4f2e-9a57-2f1d6c2b8e11
        displayName:
          type:
          - string
          - "null"
          description: Name from the identity provider; null when it has none
          example: Alex Example
          maxLength: 255
        email:
          type:
          - string
          - "null"
          format: email
          description: Email from the identity provider; null when it has none
          example: alex@example.com
          maxLength: 320
        avatarUrl:
          type:
          - string
          - "null"
          format: uri
          description: HTTPS address of the avatar image; null when there is none
          example: https://lh3.googleusercontent.com/a/example
          maxLength: 2048
        firstSeenAt:
          type: string
          format: date-time
          description: When the record was created (UTC)
          example: 2026-10-25T09:15:00Z
        lastSeenAt:
          type: string
          format: date-time
          description: When the user last called this operation (UTC)
          example: 2026-10-26T18:02:41Z
      required:
      - avatarUrl
      - displayName
      - email
      - firstSeenAt
      - id
      - lastSeenAt
    Money:
      type: object
      description: An exact amount and its currency
      properties:
        amount:
          type: string
          description: "Exact decimal as a string, greater than 0. Responses always\
            \ carry 2 decimals"
          example: "84.37"
          pattern: "^\\d{1,8}(\\.\\d{1,2})?$"
        currency:
          type: string
          description: ISO 4217 code. Must be the app's configured currency
          example: CAD
          pattern: "^[A-Z]{3}$"
      required:
      - amount
      - currency
    SpendingRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          description: "Today or earlier, in the app's time zone"
          example: 2026-10-20
        merchant:
          type: string
          example: Loblaws
          maxLength: 255
          minLength: 0
        amount:
          $ref: "#/components/schemas/Money"
        categoryId:
          type:
          - string
          - "null"
          format: uuid
          description: One of the caller's categories. Give exactly one of categoryId
            and categoryName
          example: 2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55
        accountId:
          type:
          - string
          - "null"
          format: uuid
          description: One of the caller's accounts. Give exactly one of accountId
            and accountName
          example: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
        categoryName:
          type:
          - string
          - "null"
          description: "Instead of categoryId: matched against the caller's categories\
            \ ignoring case and surrounding spaces. Refused (422, NotFound) when none\
            \ matches; never creates a category"
          example: Coffee
          maxLength: 50
          minLength: 0
        accountName:
          type:
          - string
          - "null"
          description: "Instead of accountId: matched against the caller's accounts\
            \ ignoring case and surrounding spaces. Refused (422, NotFound) when none\
            \ matches; never creates an account"
          example: Visa
          maxLength: 50
          minLength: 0
      required:
      - amount
      - date
      - merchant
    Ref:
      type: object
      description: Another resource's id and current name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Groceries
      required:
      - id
      - name
    Spending:
      type: object
      description: One of the caller's spendings
      properties:
        id:
          type: string
          format: uuid
          example: 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66
        date:
          type: string
          format: date
          example: 2026-10-20
        merchant:
          type: string
          example: Loblaws
        amount:
          $ref: "#/components/schemas/Money"
        category:
          $ref: "#/components/schemas/Ref"
        account:
          $ref: "#/components/schemas/Ref"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-27T14:03:11Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-27T14:03:11Z
      required:
      - account
      - amount
      - category
      - createdAt
      - date
      - id
      - merchant
      - updatedAt
    IncomeRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          description: "Today or earlier, in the app's time zone"
          example: 2026-10-15
        source:
          type: string
          description: Who paid it
          example: Acme Corp
          maxLength: 255
          minLength: 0
        amount:
          $ref: "#/components/schemas/Money"
        categoryId:
          type:
          - string
          - "null"
          format: uuid
          description: One of the caller's income categories. Give exactly one of
            categoryId and categoryName
          example: 6e7f8091-2b3c-4d4e-8f5a-6b7c8d9e0f12
        accountId:
          type:
          - string
          - "null"
          format: uuid
          description: One of the caller's accounts. Give exactly one of accountId
            and accountName
          example: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
        categoryName:
          type:
          - string
          - "null"
          description: "Instead of categoryId: matched against the caller's income\
            \ categories ignoring case and surrounding spaces. Refused (422, NotFound)\
            \ when none matches, including a spending category's name; never creates\
            \ a category"
          example: Salary
          maxLength: 50
          minLength: 0
        accountName:
          type:
          - string
          - "null"
          description: "Instead of accountId: matched against the caller's accounts\
            \ ignoring case and surrounding spaces. Refused (422, NotFound) when none\
            \ matches; never creates an account"
          example: Debit card
          maxLength: 50
          minLength: 0
      required:
      - amount
      - date
      - source
    Income:
      type: object
      description: One of the caller's income entries
      properties:
        id:
          type: string
          format: uuid
          example: 9b1e2c3d-4f5a-4b6c-8d7e-0f1a2b3c4d5e
        date:
          type: string
          format: date
          example: 2026-10-15
        source:
          type: string
          description: Who paid it
          example: Acme Corp
        amount:
          $ref: "#/components/schemas/Money"
        category:
          $ref: "#/components/schemas/Ref"
          description: One of the caller's income categories
        account:
          $ref: "#/components/schemas/Ref"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-15T14:03:11Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-15T14:03:11Z
      required:
      - account
      - amount
      - category
      - createdAt
      - date
      - id
      - source
      - updatedAt
    NameRequest:
      type: object
      properties:
        name:
          type: string
          description: Trimmed before use; unique per user ignoring case
          example: Amex
          maxLength: 50
          minLength: 0
      required:
      - name
    IncomeCategory:
      type: object
      description: What kind of income it is; a separate list from spending categories
      properties:
        id:
          type: string
          format: uuid
          example: 6e7f8091-2b3c-4d4e-8f5a-6b7c8d9e0f12
        name:
          type: string
          example: Salary
          maxLength: 50
        incomeCount:
          type: integer
          format: int64
          description: How many of the caller's income entries use this category
          minimum: 0
          readOnly: true
        color:
          type: string
          description: The category's colour in charts. Fixed for Salary and Investments;
            assigned once to a custom income category when it is created and kept
            after renaming
          example: "#1e5b45"
          pattern: "^#[0-9a-f]{6}$"
          readOnly: true
        isDefault:
          type: boolean
          description: "True for Salary and Investments, which every user starts with;\
            \ they cannot be renamed or deleted"
          readOnly: true
      required:
      - color
      - id
      - incomeCount
      - isDefault
      - name
    Category:
      type: object
      description: What the caller's money was spent on
      properties:
        id:
          type: string
          format: uuid
          example: 2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55
        name:
          type: string
          example: Groceries
          maxLength: 50
        spendingCount:
          type: integer
          format: int64
          description: How many of the caller's spendings use this category
          minimum: 0
          readOnly: true
        color:
          type: string
          description: The category's colour in charts. Fixed for the 17 defaults;
            assigned once to a custom category when it is created and kept after renaming
          example: "#1e5b45"
          pattern: "^#[0-9a-f]{6}$"
          readOnly: true
        isDefault:
          type: boolean
          description: True for the 17 categories every user starts with; they cannot
            be renamed or deleted
          readOnly: true
      required:
      - color
      - id
      - isDefault
      - name
      - spendingCount
    Account:
      type: object
      description: Where the caller's money was paid from
      properties:
        id:
          type: string
          format: uuid
          example: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
        name:
          type: string
          example: Amex
          maxLength: 50
        spendingCount:
          type: integer
          format: int64
          description: How many of the caller's spendings use this account
          minimum: 0
          readOnly: true
        color:
          type: string
          description: "The account's colour, assigned when it is created and kept\
            \ for its lifetime (including renames). Drawn in the By account table\
            \ and donut"
          example: "#e11d48"
          pattern: "^#[0-9a-f]{6}$"
          readOnly: true
        incomeCount:
          type: integer
          format: int64
          description: How many of the caller's income entries use this account
          minimum: 0
          readOnly: true
      required:
      - color
      - id
      - incomeCount
      - name
      - spendingCount
    SpendingImportRequest:
      type: object
      description: "The rows to import, in the order the user reviewed them"
      properties:
        spendings:
          type: array
          items:
            $ref: "#/components/schemas/SpendingImportRow"
          maxItems: 1000
          minItems: 1
      required:
      - spendings
    SpendingImportRow:
      type: object
      description: "One spending. The same rules as SpendingRequest, with category\
        \ and account by name"
      properties:
        date:
          type: string
          format: date
          description: "Today or earlier, in the app's time zone"
          example: 2026-10-28
        merchant:
          type: string
          example: Corner Bakery
          maxLength: 255
          minLength: 0
        amount:
          $ref: "#/components/schemas/Money"
        categoryName:
          type: string
          description: "Matched against the caller's categories ignoring case and\
            \ surrounding spaces. Refused (422, NotFound) when none matches; never\
            \ creates a category"
          example: Groceries
          maxLength: 50
          minLength: 0
        accountName:
          type: string
          description: "Matched against the caller's accounts ignoring case and surrounding\
            \ spaces. Refused (422, NotFound) when none matches; never creates an\
            \ account"
          example: Visa
          maxLength: 50
          minLength: 0
      required:
      - accountName
      - amount
      - categoryName
      - date
      - merchant
    MoneyTotal:
      type: object
      description: A sum of amounts. Unlike Money it may be zero and has no 8-digit
        cap. Always 2 decimals
      properties:
        amount:
          type: string
          example: "2748.42"
          pattern: "^\\d+\\.\\d{2}$"
        currency:
          type: string
          description: "ISO 4217 code: the app's configured currency"
          example: CAD
          pattern: "^[A-Z]{3}$"
      required:
      - amount
      - currency
    SpendingImport:
      type: object
      description: The receipt of a completed import. Holds nothing from the imported
        file
      properties:
        id:
          type: string
          format: uuid
          example: 9b2f6e1a-4c3d-4e5f-8a7b-0c1d2e3f4a5b
        spendingCount:
          type: integer
          format: int32
          description: How many spendings were created
          example: 2
          maximum: 1000
          minimum: 1
        firstDate:
          type: string
          format: date
          description: The earliest spending date in the import
          example: 2026-09-30
        lastDate:
          type: string
          format: date
          description: The latest spending date in the import; clients show this month
            afterwards
          example: 2026-10-28
        total:
          $ref: "#/components/schemas/MoneyTotal"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-29T14:03:11Z
      required:
      - createdAt
      - firstDate
      - id
      - lastDate
      - spendingCount
      - total
    IncomeImportRequest:
      type: object
      description: "The income rows to import, in the order the user reviewed them"
      properties:
        incomes:
          type: array
          items:
            $ref: "#/components/schemas/IncomeImportRow"
          maxItems: 1000
          minItems: 1
      required:
      - incomes
    IncomeImportRow:
      type: object
      description: "One income entry. The same rules as IncomeRequest, with category\
        \ and account by name"
      properties:
        date:
          type: string
          format: date
          description: "Today or earlier, in the app's time zone"
          example: 2026-10-15
        source:
          type: string
          example: Acme Corp
          maxLength: 255
          minLength: 0
        amount:
          $ref: "#/components/schemas/Money"
        categoryName:
          type: string
          description: "Matched against the caller's income categories ignoring case\
            \ and surrounding spaces. Refused (422, NotFound) when none matches; never\
            \ creates a category"
          example: Salary
          maxLength: 50
          minLength: 0
        accountName:
          type: string
          description: "Matched against the caller's accounts ignoring case and surrounding\
            \ spaces. Refused (422, NotFound) when none matches; never creates an\
            \ account"
          example: Debit card
          maxLength: 50
          minLength: 0
      required:
      - accountName
      - amount
      - categoryName
      - date
      - source
    IncomeImport:
      type: object
      description: The receipt of a completed income import. Holds nothing from the
        file
      properties:
        id:
          type: string
          format: uuid
          example: 4c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f
        incomeCount:
          type: integer
          format: int32
          description: How many income entries were created
          example: 2
          maximum: 1000
          minimum: 1
        firstDate:
          type: string
          format: date
          description: The earliest date in the import
          example: 2026-10-15
        lastDate:
          type: string
          format: date
          description: The latest date in the import; clients show this month afterwards
          example: 2026-10-20
        total:
          $ref: "#/components/schemas/MoneyTotal"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-29T14:03:11Z
      required:
      - createdAt
      - firstDate
      - id
      - incomeCount
      - lastDate
      - total
    SpendingPage:
      type: object
      description: One page of the caller's spendings; `items` is empty when nothing
        matches
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Spending"
        page:
          type: integer
          format: int32
          description: 0-based page number
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          description: "Spendings matching the filters, across all pages"
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    MonthTotal:
      type: object
      description: One month's total; zero when nothing was spent
      properties:
        month:
          type: string
          example: 2026-10
          pattern: "^\\d{4}-\\d{2}$"
        total:
          $ref: "#/components/schemas/MoneyTotal"
        spendingCount:
          type: integer
          format: int64
          example: 14
          minimum: 0
      required:
      - month
      - spendingCount
      - total
    MonthlyTotals:
      type: object
      description: "Every month of a year, January to December"
      properties:
        year:
          type: integer
          format: int32
          example: 2026
        today:
          type: string
          format: date
          description: Today in the app's time zone
          example: 2026-10-28
        months:
          type: array
          items:
            $ref: "#/components/schemas/MonthTotal"
          maxItems: 12
          minItems: 12
      required:
      - months
      - today
      - year
    IncomeMonthTotal:
      type: object
      description: One month's income; zero when nothing was received
      properties:
        month:
          type: string
          example: 2026-10
          pattern: "^\\d{4}-\\d{2}$"
        total:
          $ref: "#/components/schemas/MoneyTotal"
        entryCount:
          type: integer
          format: int64
          description: How many income entries make up the total
          example: 3
          minimum: 0
      required:
      - entryCount
      - month
      - total
    IncomeMonthlyTotals:
      type: object
      description: "Income for every month of a year, January to December"
      properties:
        year:
          type: integer
          format: int32
          example: 2026
        today:
          type: string
          format: date
          description: Today in the app's time zone
          example: 2026-10-28
        months:
          type: array
          items:
            $ref: "#/components/schemas/IncomeMonthTotal"
          maxItems: 12
          minItems: 12
      required:
      - months
      - today
      - year
    Merchant:
      type: object
      description: A merchant derived from the caller's spendings
      properties:
        name:
          type: string
          description: Spelling on the most recent spending
          example: Neighbourhood Market
        spendingCount:
          type: integer
          format: int64
          example: 12
          minimum: 1
        lastUsedOn:
          type: string
          format: date
          example: 2026-10-27
        lastCategory:
          $ref: "#/components/schemas/Ref"
          description: Category of the most recent spending
        lastAccount:
          $ref: "#/components/schemas/Ref"
          description: Account of the most recent spending
      required:
      - lastAccount
      - lastCategory
      - lastUsedOn
      - name
      - spendingCount
    MerchantList:
      type: object
      description: "The caller's merchants, most used first"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Merchant"
        truncated:
          type: boolean
          description: True when the caller has more merchants than `limit`
      required:
      - items
      - truncated
    IncomePage:
      type: object
      description: One page of the caller's income entries; `items` is empty when
        nothing matches
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Income"
        page:
          type: integer
          format: int32
          description: 0-based page number
          minimum: 0
        size:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        totalItems:
          type: integer
          format: int64
          description: "Income entries matching the filters, across all pages"
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
    IncomeSource:
      type: object
      description: "A source derived from the caller's income entries: entries whose\
        \ source is equal ignoring case and surrounding spaces. `name`, `lastCategory`\
        \ and `lastAccount` come from the most recent one"
      properties:
        name:
          type: string
          example: Acme Corp
        incomeCount:
          type: integer
          format: int64
          description: How many of the caller's income entries have this source
          minimum: 1
        lastUsedOn:
          type: string
          format: date
          example: 2026-10-15
        lastCategory:
          $ref: "#/components/schemas/Ref"
        lastAccount:
          $ref: "#/components/schemas/Ref"
      required:
      - incomeCount
      - lastAccount
      - lastCategory
      - lastUsedOn
      - name
    IncomeSourceList:
      type: object
      description: "Sources, most used first; `truncated` is true when more exist"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncomeSource"
        truncated:
          type: boolean
      required:
      - items
      - truncated
    IncomeCategoryTotal:
      type: object
      description: One income category's income in the range
      properties:
        category:
          $ref: "#/components/schemas/Ref"
        total:
          $ref: "#/components/schemas/MoneyTotal"
        entryCount:
          type: integer
          format: int64
          example: 1
          minimum: 1
        color:
          type: string
          description: "The income category's colour, the same as IncomeCategory.color"
          example: "#1e5b45"
          pattern: "^#[0-9a-f]{6}$"
      required:
      - category
      - color
      - entryCount
      - total
    IncomeCategoryTotals:
      type: object
      description: "Income per income category over a date range: only categories\
        \ with income, largest first"
      properties:
        from:
          type: string
          format: date
          example: 2026-10-01
        to:
          type: string
          format: date
          example: 2026-10-31
        total:
          $ref: "#/components/schemas/MoneyTotal"
        entryCount:
          type: integer
          format: int64
          example: 3
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncomeCategoryTotal"
      required:
      - entryCount
      - from
      - items
      - to
      - total
    IncomeCategoryList:
      type: object
      description: "All of the caller's income categories, sorted by name (never paged)"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncomeCategory"
      required:
      - items
    IncomeAccountTotal:
      type: object
      description: One account's income in the range
      properties:
        account:
          $ref: "#/components/schemas/Ref"
        total:
          $ref: "#/components/schemas/MoneyTotal"
        entryCount:
          type: integer
          format: int64
          example: 2
          minimum: 1
        color:
          type: string
          description: "The account's colour, the same as Account.color"
          example: "#e11d48"
          pattern: "^#[0-9a-f]{6}$"
      required:
      - account
      - color
      - entryCount
      - total
    IncomeAccountTotals:
      type: object
      description: "Income per account over a date range: only accounts that received\
        \ income, largest first"
      properties:
        from:
          type: string
          format: date
          example: 2026-10-01
        to:
          type: string
          format: date
          example: 2026-10-31
        total:
          $ref: "#/components/schemas/MoneyTotal"
        entryCount:
          type: integer
          format: int64
          example: 3
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncomeAccountTotal"
      required:
      - entryCount
      - from
      - items
      - to
      - total
    CategoryTotal:
      type: object
      description: One category's spending in the range
      properties:
        category:
          $ref: "#/components/schemas/Ref"
        total:
          $ref: "#/components/schemas/MoneyTotal"
        spendingCount:
          type: integer
          format: int64
          example: 2
          minimum: 1
        color:
          type: string
          description: "The category's colour, the same as Category.color"
          example: "#c2410c"
          pattern: "^#[0-9a-f]{6}$"
      required:
      - category
      - color
      - spendingCount
      - total
    CategoryTotals:
      type: object
      description: "Spending per category over a date range: only categories with\
        \ spending, largest first"
      properties:
        from:
          type: string
          format: date
          example: 2026-10-01
        to:
          type: string
          format: date
          example: 2026-10-31
        total:
          $ref: "#/components/schemas/MoneyTotal"
        spendingCount:
          type: integer
          format: int64
          example: 14
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTotal"
      required:
      - from
      - items
      - spendingCount
      - to
      - total
    CategoryList:
      type: object
      description: "All of the caller's categories, sorted by name (never paged)"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
      - items
    AccountList:
      type: object
      description: "All of the caller's accounts, sorted by name (never paged)"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
      required:
      - items
    AccountTotal:
      type: object
      description: One account's spending in the range
      properties:
        account:
          $ref: "#/components/schemas/Ref"
        total:
          $ref: "#/components/schemas/MoneyTotal"
        spendingCount:
          type: integer
          format: int64
          example: 2
          minimum: 1
        color:
          type: string
          description: "The account's colour, the same as Account.color"
          example: "#e11d48"
          pattern: "^#[0-9a-f]{6}$"
      required:
      - account
      - color
      - spendingCount
      - total
    AccountTotals:
      type: object
      description: "Spending per account over a date range: only accounts with spending,\
        \ largest first"
      properties:
        from:
          type: string
          format: date
          example: 2026-10-01
        to:
          type: string
          format: date
          example: 2026-10-31
        total:
          $ref: "#/components/schemas/MoneyTotal"
        spendingCount:
          type: integer
          format: int64
          example: 14
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountTotal"
      required:
      - from
      - items
      - spendingCount
      - to
      - total
  responses:
    Unauthenticated:
      description: "Missing, malformed, expired, wrongly signed, wrong-issuer or wrong-audience\
        \ token. No user data is returned or created."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:hl-budget:unauthenticated
            title: Unauthorized
            status: 401
            detail: A valid bearer token is required
            instance: /api/v1/users/me
            timestamp: 2026-10-25T09:15:00Z
            traceId: 4be0baf6ee174255
    InternalError:
      description: Unexpected failure. Cause is logged against traceId and never returned
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:hl-budget:internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred
            instance: /api/v1/users/me
            timestamp: 2026-10-25T09:15:00Z
            traceId: 4be0baf6ee174255
    ServiceUnavailable:
      description: A required dependency (the database) is unreachable
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:hl-budget:service-unavailable
            title: Service Unavailable
            status: 503
            detail: The service is temporarily unavailable
            instance: /api/v1/users/me
            timestamp: 2026-10-25T09:15:00Z
            traceId: 4be0baf6ee174255
    BadRequest:
      description: "The request cannot be read: the body is not JSON, or a path id\
        \ is not a UUID"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            malformed:
              value:
                type: urn:problem:hl-budget:bad-request
                title: Bad Request
                status: 400
                detail: The path segment spendingId must be a valid UUID.
                instance: /api/v1/spendings/abc
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
    NotFound:
      description: "No such resource for the caller. Also returned for another user's\
        \ resource, so existence is never revealed"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              value:
                type: urn:problem:hl-budget:not-found
                title: Not Found
                status: 404
                detail: Spending 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66 was not found
                instance: /api/v1/spendings/8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  resource: spending
                  spendingId: 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66
    DuplicateName:
      description: "Another of the caller's accounts or categories already has this\
        \ name, ignoring case (`details.reason = duplicate-name`)"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            duplicateName:
              value:
                type: urn:problem:hl-budget:conflict
                title: Conflict
                status: 409
                detail: An account named "amex" already exists
                instance: /api/v1/accounts
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: duplicate-name
                  name: amex
    DuplicateNameOrConcurrent:
      description: '`details.reason` is `duplicate-name` or `concurrent-modification`
        (re-read and retry)'
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            duplicateName:
              value:
                type: urn:problem:hl-budget:conflict
                title: Conflict
                status: 409
                detail: An account named "amex" already exists
                instance: /api/v1/accounts
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: duplicate-name
                  name: amex
            concurrent:
              value:
                type: urn:problem:hl-budget:conflict
                title: Conflict
                status: 409
                detail: The resource was modified concurrently. Re-read it and retry.
                instance: /api/v1/accounts/3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: concurrent-modification
    ConcurrentModification:
      description: Lost a concurrent write; re-read and retry
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            concurrent:
              value:
                type: urn:problem:hl-budget:conflict
                title: Conflict
                status: 409
                detail: The resource was modified concurrently. Re-read it and retry.
                instance: /api/v1/accounts/3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: concurrent-modification
    InUse:
      description: "Entries still use this account or category; move or delete them\
        \ first (`details.reason = in-use`, `details.spendingCount`; for an account\
        \ also `details.incomeCount`, the income entries that use it)"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            inUseByIncome:
              value:
                type: urn:problem:hl-budget:conflict
                title: Conflict
                status: 409
                detail: Account 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11 is used by 2
                  income entries
                instance: /api/v1/accounts/3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: in-use
                  spendingCount: 0
                  incomeCount: 2
            inUse:
              value:
                type: urn:problem:hl-budget:conflict
                title: Conflict
                status: 409
                detail: Account 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11 is used by 2
                  spendings
                instance: /api/v1/accounts/3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: in-use
                  spendingCount: 2
    LastAccount:
      description: The caller's only account cannot be deleted; add another account
        first (`details.reason = last-account`)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            lastAccount:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: Account 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11 is the only account
                instance: /api/v1/accounts/3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: last-account
    DefaultCategory:
      description: Default categories cannot be renamed or deleted (`details.reason
        = default-category`)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            defaultCategory:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: Groceries is a default category and cannot be changed
                instance: /api/v1/categories/2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: default-category
    ValidationFailed:
      description: One or more fields or parameters are invalid; each one is listed
        in `errors` with a JSON Pointer and a stable `code`
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: "1 field is invalid: name"
                instance: /api/v1/accounts
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                errors:
                - pointer: "#/name"
                  field: name
                  code: NotBlank
                  message: must not be blank
    ValidationOrDefaultCategory:
      description: "An invalid field (`errors`), or the category is a default (`details.reason\
        \ = default-category`)"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: "1 field is invalid: name"
                instance: /api/v1/accounts
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                errors:
                - pointer: "#/name"
                  field: name
                  code: NotBlank
                  message: must not be blank
            defaultCategory:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: Groceries is a default category and cannot be changed
                instance: /api/v1/categories/2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55
                timestamp: 2026-10-27T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: default-category
    SpendingValidationFailed:
      description: "Invalid fields, each listed in `errors`. Codes include Required,\
        \ TypeMismatch, NotBlank, Size, Pattern, Positive, UnsupportedCurrency, NotFuture,\
        \ NotFound (an unknown or another user's category or account, by id or by\
