# Single source of truth for every version in this build.
# Anything Spring Boot's BOM manages is deliberately absent here - see build.gradle.kts.
[versions]
kotlin = "2.3.21"          # must match the kotlin.version Spring Boot's BOM manages
springBoot = "4.1.2"
springdoc = "3.1.1"        # 3.x is the Spring Boot 4 / Framework 7 line; 2.x is Boot 3
ktlintPlugin = "14.2.0"
ktlintTool = "1.8.0"
detekt = "1.23.8"
kover = "0.9.11"
mockk = "1.14.11"
wiremock = "3.13.2"

[libraries]
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
