  /api/v1/incomes:
    get:
      tags:
      - Incomes
      summary: "List the caller's income entries, paged, filtered and sorted"
      description: "Filters are optional and combine with AND; repeating `categoryId`\
        \ (income categories) or `accountId` matches any of the given ids. Ties in\
        \ the sort order are broken by creation time in the same direction, then by\
        \ id, so paging never skips or repeats an entry."
      operationId: listIncomes
      parameters:
      - name: from
        in: query
        description: "Earliest date, inclusive"
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-01
      - name: to
        in: query
        description: "Latest date, inclusive; must not be before `from`"
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-31
      - name: categoryId
        in: query
        description: Repeatable; matches any of the given income categories
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: accountId
        in: query
        description: Repeatable; matches any of the given accounts
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: 0-based page number
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page, 1 to 100"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        description: Sort order
        required: false
        schema:
          type: string
          default: "date,desc"
          enum:
          - "date,desc"
          - "date,asc"
          - "amount,desc"
          - "amount,asc"
      responses:
        "200":
          description: One page; `items` is empty when nothing matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
      - Incomes
      summary: Record an income entry
      description: "Send an `Idempotency-Key` to make retries safe: repeating a create\
        \ with the same key and the same body returns the first entry with 200 and\
        \ `Idempotent-Replayed: true` instead of creating another. The key is freed\
        \ when that entry is deleted. The income category and the account are each\
        \ given by id or by name (exactly one of each pair). A name is matched against\
        \ the caller's income categories or accounts ignoring case and surrounding\
        \ spaces; a name that matches none, including a spending category's name,\
        \ is refused with NotFound and nothing is created."
      operationId: createIncome
      parameters:
      - name: Idempotency-Key
        in: header
        description: "Optional. 1 to 255 visible ASCII characters, unique per create\
          \ you want deduplicated"
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 1
          pattern: "^[\\x21-\\x7E]+$"
        example: 5d1f0c2e-retry-safe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeRequest"
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              $ref: "#/components/headers/Location"
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
              examples:
                created:
                  description: created
                  value:
                    id: 9b1e2c3d-4f5a-4b6c-8d7e-0f1a2b3c4d5e
                    date: 2026-10-15
                    source: Acme Corp
                    amount:
                      amount: "5000.00"
                      currency: CAD
                    category:
                      id: 6e7f8091-2b3c-4d4e-8f5a-6b7c8d9e0f12
                      name: Salary
                    account:
                      id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                      name: Debit card
                    createdAt: 2026-10-15T14:03:11Z
                    updatedAt: 2026-10-15T14:03:11Z
        "200":
          description: A replay of an earlier create with the same Idempotency-Key
            and body; nothing new was created
          headers:
            Idempotent-Replayed:
              description: Always `true` on a replay
              style: simple
              schema:
                type: string
                enum:
                - "true"
            Location:
              $ref: "#/components/headers/Location"
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/IncomeValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/income-imports:
    post:
      tags:
      - Income imports
      summary: "Record many income entries at once, all or nothing"
      description: |-
        Creates every row as an income entry in one step. If any row is invalid, nothing is created and every problem is listed, with a JSON Pointer naming the row (`#/incomes/3/date`).

        Income categories and accounts are given by name. Each name must match one of the caller's income categories or accounts, ignoring case and surrounding spaces; a name that matches none is refused with NotFound at that row, and nothing is created. Categories and accounts are created only through their own endpoints.

        Send an `Idempotency-Key` to make retries safe: repeating an import with the same key and the same rows returns the first import with 200 and `Idempotent-Replayed: true` instead of creating the entries again.
      operationId: createIncomeImport
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional. 1 to 255 visible ASCII characters; a UUID is recommended
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 1
          pattern: "^[\\x21-\\x7E]+$"
        example: 6a1d9c2e-8f4b-4b7a-9e3c-1f2d3c4b5a69
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeImportRequest"
            examples:
              twoRows:
                description: twoRows
                value:
                  incomes:
                  - date: 2026-10-15
                    source: Acme Corp
                    amount:
                      amount: "5000.00"
                      currency: CAD
                    categoryName: Salary
                    accountName: Debit card
                  - date: 2026-10-20
                    source: Wealthsimple
                    amount:
                      amount: "120.25"
                      currency: CAD
                    categoryName: investments
                    accountName: Debit card
        required: true
      responses:
        "201":
          description: Created; every row is now an income entry
          headers:
            Location:
              $ref: "#/components/headers/Location"
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeImport"
              examples:
                created:
                  description: created
                  value:
                    id: 4c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f
                    incomeCount: 2
                    firstDate: 2026-10-15
                    lastDate: 2026-10-20
                    total:
                      amount: "5120.25"
                      currency: CAD
                    createdAt: 2026-10-29T14:03:11Z
        "200":
          description: A replay of an earlier import with the same Idempotency-Key
            and rows; nothing new was created
          headers:
            Idempotent-Replayed:
              description: Always `true` on a replay
              style: simple
              schema:
                type: string
                enum:
                - "true"
            Location:
              $ref: "#/components/headers/Location"
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeImport"
              examples:
                replayed:
                  description: replayed
                  value:
                    id: 4c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f
                    incomeCount: 2
                    firstDate: 2026-10-15
                    lastDate: 2026-10-20
                    total:
                      amount: "5120.25"
                      currency: CAD
                    createdAt: 2026-10-29T14:03:11Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/IncomeImportValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
