openapi: 3.1.0
info:
  title: HL Budget API
  description: |-
    Backend for HL Budget. Every business endpoint is versioned under `/api/v{N}` and requires an
    Auth0 access token for the HL Budget API audience. Every error is RFC 9457
    `application/problem+json` with a stable `type` URN and a `traceId`.
  version: 1.0.0
servers:
- url: /
  description: Same host as the web app; the backend serves /api
security:
- bearerAuth: []
tags:
- name: Users
  description: The signed-in user's own record
- name: Accounts
  description: Where the caller's money was paid from
- name: Categories
  description: "What the caller's money was spent on, including the 17 defaults"
- name: Spendings
  description: The caller's spending transactions
- name: Incomes
  description: The caller's income entries and their past sources (feature 009)
- name: Income categories
  description: "What kind of income it is, including Salary and Investments"
- name: Totals
  description: "Sums of the caller's spendings and income by month, category and account"
- name: Spending imports
  description: "Adding many spendings at once, all or nothing"
- name: Income imports
  description: "Adding many income entries at once, all or nothing"
- name: Merchants
  description: "Merchants derived from the caller's spendings, for autofill"
- name: Operations
  description: Unversioned probes for the platform (not routed through the ingress)
paths:
  /healthz:
    get:
      tags:
      - Operations
      summary: Liveness probe; checks no dependencies
      operationId: liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: UP
      security: []
  /readyz:
    get:
      tags:
      - Operations
      summary: Readiness probe; fails while Postgres is unreachable
      operationId: readiness
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: UP
        "503":
          description: Not ready (database unreachable). No details are disclosed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: DOWN
      security: []
  /api/v1/users/me:
    put:
      tags:
      - Users
      summary: Create or refresh the caller's user record and return it
      description: "Identifies the caller only from the validated access token (`sub`).\
        \ On the first call for a `sub`, creates the user record and returns 201 with\
        \ a `Location` header. On later calls, sets `lastSeenAt` to now, refreshes\
        \ `displayName`, `email` and `avatarUrl` from the token's claims, and returns\
        \ 200. Idempotent: concurrent first calls yield exactly one record. Takes\
        \ no request body and no user identifier."
      operationId: ensureMyProfile
      responses:
        "200":
          description: Existing record refreshed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              examples:
                returning:
                  $ref: "#/components/examples/ProfileReturning"
        "201":
          description: Record created on first call
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
              style: simple
            Location:
              description: Address of the created resource
              style: simple
              schema:
                type: string
                example: /api/v1/users/me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              examples:
                firstVisit:
                  $ref: "#/components/examples/ProfileFirstVisit"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/spendings/{spendingId}:
    get:
      tags:
      - Spendings
      summary: Fetch one of the caller's spendings
      operationId: getSpending
      parameters:
      - name: spendingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The spending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spending"
              examples:
                found:
                  description: found
                  value:
                    id: 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66
                    date: 2026-10-20
                    merchant: Loblaws
                    amount:
                      amount: "84.37"
                      currency: CAD
                    category:
                      id: 2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55
                      name: Groceries
                    account:
                      id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                      name: Amex
                    createdAt: 2026-10-27T14:03:11Z
                    updatedAt: 2026-10-27T14:03:11Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
      - Spendings
      summary: Replace all details of a spending
      description: "The category and the account are each given by id or by name (exactly\
        \ one of each pair). A name is matched against the caller's items ignoring\
        \ case and surrounding spaces, and created in the same transaction when none\
        \ matches; if the spending is refused, nothing is created."
      operationId: updateSpending
      parameters:
      - name: spendingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpendingRequest"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConcurrentModification"
        "422":
          $ref: "#/components/responses/SpendingValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
      - Spendings
      summary: Delete a spending permanently
      operationId: deleteSpending
      parameters:
      - name: spendingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/incomes/{incomeId}:
    get:
      tags:
      - Incomes
      summary: Fetch one of the caller's income entries
      operationId: getIncome
      parameters:
      - name: incomeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The income entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
              examples:
                found:
                  description: found
                  value:
                    id: 9b1e2c3d-4f5a-4b6c-8d7e-0f1a2b3c4d5e
                    date: 2026-10-15
                    source: Acme Corp
                    amount:
                      amount: "5000.00"
                      currency: CAD
                    category:
                      id: 6e7f8091-2b3c-4d4e-8f5a-6b7c8d9e0f12
                      name: Salary
                    account:
                      id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                      name: Debit card
                    createdAt: 2026-10-15T14:03:11Z
                    updatedAt: 2026-10-15T14:03:11Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
      - Incomes
      summary: Replace all details of an income entry
      description: "The income category and the account are each given by id or by\
        \ name (exactly one of each pair). A name is matched against the caller's\
        \ income categories or accounts ignoring case and surrounding spaces; a name\
        \ that matches none, including a spending category's name, is refused with\
        \ NotFound and nothing is created."
      operationId: updateIncome
      parameters:
      - name: incomeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeRequest"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConcurrentModification"
        "422":
          $ref: "#/components/responses/IncomeValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
      - Incomes
      summary: Delete an income entry permanently
      operationId: deleteIncome
      parameters:
      - name: incomeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/income-categories/{incomeCategoryId}:
    get:
      tags:
      - Income categories
      summary: Fetch one of the caller's income categories
      operationId: getIncomeCategory
      parameters:
      - name: incomeCategoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The income category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
      - Income categories
      summary: Rename a custom income category; its colour is kept
      description: "Salary and Investments cannot be renamed: 422 with `details.reason\
        \ = default-category`."
      operationId: renameIncomeCategory
      parameters:
      - name: incomeCategoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
        required: true
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DuplicateNameOrConcurrent"
        "422":
          $ref: "#/components/responses/ValidationOrDefaultCategory"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
      - Income categories
      summary: Delete a custom income category that no income entry uses
      description: "Salary and Investments cannot be deleted: 422 with `details.reason\
        \ = default-category`."
      operationId: deleteIncomeCategory
      parameters:
      - name: incomeCategoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IncomeCategoryInUse"
        "422":
          $ref: "#/components/responses/DefaultCategory"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/categories/{categoryId}:
    get:
      tags:
      - Categories
      summary: Fetch one of the caller's categories
      operationId: getCategory
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
      - Categories
      summary: Rename a custom category
      description: "Default categories cannot be renamed: 422 with `details.reason\
        \ = default-category`."
      operationId: renameCategory
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
        required: true
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DuplicateNameOrConcurrent"
        "422":
          $ref: "#/components/responses/ValidationOrDefaultCategory"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
      - Categories
      summary: Delete a custom category that no spending uses
      description: "Default categories cannot be deleted: 422 with `details.reason\
        \ = default-category`."
      operationId: deleteCategory
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InUse"
        "422":
          $ref: "#/components/responses/DefaultCategory"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Fetch one of the caller's accounts
      operationId: getAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
      - Accounts
      summary: Rename an account (its name is its only field)
      operationId: renameAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
        required: true
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DuplicateNameOrConcurrent"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
      - Accounts
      summary: Delete an account that no spending uses
      description: "Refused in this order: not found (404), used by spendings (409\
        \ `in-use`), the caller's only account (422 `last-account`)."
      operationId: deleteAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InUse"
        "422":
          $ref: "#/components/responses/LastAccount"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/spendings:
    get:
      tags:
      - Spendings
      summary: "List the caller's spendings, paged, filtered and sorted"
      description: "Filters are optional and combine with AND; repeating `categoryId`\
        \ or `accountId` matches any of the given ids. Ties in the sort order are\
        \ broken by creation time in the same direction, then by id, so paging never\
        \ skips or repeats a spending."
      operationId: listSpendings
      parameters:
      - name: from
        in: query
        description: "Earliest date, inclusive"
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-01
      - name: to
        in: query
        description: "Latest date, inclusive; must not be before `from`"
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-31
      - name: categoryId
        in: query
        description: Repeatable; matches any of the given categories
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: accountId
        in: query
        description: Repeatable; matches any of the given accounts
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: page
        in: query
        description: 0-based page number
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Items per page, 1 to 100"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        description: Sort order
        required: false
        schema:
          type: string
          default: "date,desc"
          enum:
          - "date,desc"
          - "date,asc"
          - "amount,desc"
          - "amount,asc"
      responses:
        "200":
          description: One page; `items` is empty when nothing matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
      - Spendings
      summary: Record a spending
      description: "Send an `Idempotency-Key` to make retries safe: repeating a create\
        \ with the same key and the same body returns the first spending with 200\
        \ and `Idempotent-Replayed: true` instead of creating another. The key is\
        \ freed when that spending is deleted. The category and the account are each\
        \ given by id or by name (exactly one of each pair). A name is matched against\
        \ the caller's items ignoring case and surrounding spaces, and created in\
        \ the same transaction when none matches; if the spending is refused, nothing\
        \ is created."
      operationId: createSpending
      parameters:
      - name: Idempotency-Key
        in: header
        description: "Optional. 1 to 255 visible ASCII characters, unique per create\
          \ you want deduplicated"
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 1
          pattern: "^[\\x21-\\x7E]+$"
        example: 5d1f0c2e-retry-safe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpendingRequest"
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              $ref: "#/components/headers/Location"
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spending"
              examples:
                created:
                  description: created
                  value:
                    id: 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66
                    date: 2026-10-20
                    merchant: Loblaws
                    amount:
                      amount: "84.37"
                      currency: CAD
                    category:
                      id: 2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55
                      name: Groceries
                    account:
                      id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
                      name: Amex
                    createdAt: 2026-10-27T14:03:11Z
                    updatedAt: 2026-10-27T14:03:11Z
        "200":
          description: A replay of an earlier create with the same Idempotency-Key
            and body; nothing new was created
          headers:
            Idempotent-Replayed:
              description: Always `true` on a replay
              style: simple
              schema:
                type: string
                enum:
                - "true"
            Location:
              $ref: "#/components/headers/Location"
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/SpendingValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/spending-imports:
    post:
      tags:
      - Spending imports
      summary: "Record many spendings at once, all or nothing"
      description: |-
        Creates every row as a spending in one step. If any row is invalid, nothing is created and every problem is listed, with a JSON Pointer naming the row (`#/spendings/3/date`).

        Categories and accounts are given by name. Each name must match one of the caller's items, ignoring case and surrounding spaces; a name that matches none is refused with NotFound at that row, and nothing is created. Categories and accounts are created only through their own endpoints.

        Send an `Idempotency-Key` to make retries safe: repeating an import with the same key and the same rows returns the first import with 200 and `Idempotent-Replayed: true` instead of creating the spendings again.
      operationId: createSpendingImport
      parameters:
      - name: Idempotency-Key
        in: header
