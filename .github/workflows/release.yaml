# Build this service's image and propose deploying it to the homelab.
#
#   pull request  -> build only (proves the Dockerfile builds)
#   push to main  -> push ghcr.io/valyalkin/<image>:<run>-<sha7>, then open/refresh a PR in
#                    valyalkin/hl-helm pinning that tag and digest. Merging that PR deploys.
#
# Reads app / service / image / platforms from homelab.yaml at the repository root.
# Uses the repository secret HL_HELM_TOKEN: a fine-grained PAT on valyalkin/hl-helm with Contents
# and Pull requests read/write (a PR opened with GITHUB_TOKEN would not run hl-helm CI). Without
# it, images still build and push; the deploy PR step is skipped with a warning.
# Images are public on ghcr.io: make each new package public once in its settings page.
# Generated by the homelab plugin (valyalkin/hl-skills); see hl-helm docs/onboarding.md § C.
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: valyalkin
  HL_HELM_REPO: valyalkin/hl-helm
  HELM_DOCS_VERSION: 1.14.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.cfg.outputs.app }}
      service: ${{ steps.cfg.outputs.service }}
      image: ${{ steps.cfg.outputs.image }}
      tag: ${{ steps.cfg.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Read homelab.yaml
        id: cfg
        run: |
          for k in app service image platforms; do
            v=$(yq -r ".$k // \"\"" homelab.yaml)
            [ -n "$v" ] || { echo "::error file=homelab.yaml::'$k' is not set"; exit 1; }
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          echo "tag=${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ steps.cfg.outputs.image }}
          tags: type=raw,value=${{ steps.cfg.outputs.tag }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed \`${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.tag }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  propose-deploy:
    # One rolling PR per service (branch bump/<app>/<service>), rebuilt from hl-helm main on every
    # release, so it always carries the latest image and never conflicts with what merged before.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP: ${{ needs.build.outputs.app }}
      SERVICE: ${{ needs.build.outputs.service }}
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
      DIGEST: ${{ needs.build.outputs.digest }}
      GH_TOKEN: ${{ secrets.HL_HELM_TOKEN }}
    steps:
      - name: Check HL_HELM_TOKEN
        id: token
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::HL_HELM_TOKEN is not set, so no deploy PR was opened. The image was pushed: $REGISTRY/$REGISTRY_OWNER/$IMAGE:$TAG@$DIGEST (see hl-helm docs/onboarding.md § C)"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.HL_HELM_REPO }}
          ref: main
          token: ${{ secrets.HL_HELM_TOKEN }}
          path: hl-helm

      - name: Install helm-docs and PyYAML
        if: steps.token.outputs.ok == 'true'
        run: |
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" | sudo tar xz -C /usr/local/bin helm-docs
          python3 -c 'import yaml' 2>/dev/null || pip install pyyaml

      - name: Pin the new image
        if: steps.token.outputs.ok == 'true'
        id: bump
        working-directory: hl-helm
        run: |
          version=$(scripts/bump-image.py "$APP" "$SERVICE" "$TAG" "$DIGEST")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Open or update the hl-helm pull request
        if: steps.token.outputs.ok == 'true'
        working-directory: hl-helm
        run: |
          branch="bump/$APP/$SERVICE"
          title="$APP/$SERVICE: deploy $IMAGE:$TAG"
          src="${{ github.server_url }}/${{ github.repository }}"
          body=$(cat <<EOF
          Deploys \`$REGISTRY/$REGISTRY_OWNER/$IMAGE:$TAG\` to \`$APP/$SERVICE\` (chart version ${{ steps.bump.outputs.version }}).

          - Source: $src/commit/${{ github.sha }}
          - Build: $src/actions/runs/${{ github.run_id }}
          - Digest: \`$DIGEST\`

          Merging deploys it (Argo CD auto-sync). Review the rendered diff in this PR's CI summary.
          Opened by the release workflow of ${{ github.repository }}.
          EOF
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A charts/apps/"$APP"
          git commit -q -m "$title" -m "Source: $src/commit/${{ github.sha }}"
          git push --force origin "$branch"
          if gh pr view "$branch" --repo "$HL_HELM_REPO" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --repo "$HL_HELM_REPO" --title "$title" --body "$body"
          else
            gh pr create --repo "$HL_HELM_REPO" --base main --head "$branch" --title "$title" --body "$body"
          fi
          echo "hl-helm PR: $(gh pr view "$branch" --repo "$HL_HELM_REPO" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
